name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build & Export iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Selecting Xcode..."
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project with XcodeGen
        run: |
          cd ios
          xcodegen generate --spec project.yml

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "::warning ::BUILD_CERTIFICATE_BASE64 not configured. Will produce unsigned release build."
            exit 0
          fi

          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Create ExportOptions.plist
        run: |
          cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>destination</key>
              <string>export</string>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Build & Package IPA
        run: |
          cd ios
          mkdir -p build/out
          if [ -z "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" ]; then
            echo "No signing secrets provided. Building unsigned release app bundle..."
            set -o pipefail
            xcodebuild build \
              -project TransferApp.xcodeproj \
              -scheme TransferApp \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_ENTITLEMENTS="" \
              2>&1 | tee xcodebuild.log || {
                echo "::error ::xcodebuild failed! Showing detailed errors:"
                grep -E -C 3 "(error:|fatal error:|warning:.*failed|The following build commands failed:)" xcodebuild.log || tail -n 120 xcodebuild.log
                exit 1
              }

            echo "Locating built TransferApp.app..."
            APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "TransferApp.app" -type d | head -n 1)
            if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
              echo "::error ::TransferApp.app not found in build output!"
              exit 1
            fi
            echo "Found app at: $APP_PATH"

            echo "Checking embedded plugins..."
            SHARE_PLIST="$APP_PATH/PlugIns/ShareExtension.appex/Info.plist"
            if [ -f "$SHARE_PLIST" ]; then
              plutil -p "$SHARE_PLIST"
              echo "ShareExtension Info.plist verified."
            else
              echo "ShareExtension not automatically in PlugIns, checking products..."
              EXT_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "ShareExtension.appex" -type d | head -n 1)
              if [ -n "$EXT_PATH" ] && [ -d "$EXT_PATH" ]; then
                mkdir -p "$APP_PATH/PlugIns"
                cp -r "$EXT_PATH" "$APP_PATH/PlugIns/"
                echo "Copied ShareExtension.appex into $APP_PATH/PlugIns/"
              fi
            fi

            echo "Packaging unsigned IPA payload..."
            mkdir -p build/payload_temp/Payload
            cp -r "$APP_PATH" build/payload_temp/Payload/
            cd build/payload_temp
            zip -qr ../out/TransferApp.ipa Payload
            cd ../..
            rm -rf build/payload_temp
            echo "Unsigned IPA successfully created at ios/build/out/TransferApp.ipa"
          else
            echo "Building signed archive with Apple credentials..."
            set -o pipefail
            xcodebuild archive \
              -project TransferApp.xcodeproj \
              -scheme TransferApp \
              -archivePath build/TransferApp.xcarchive \
              -destination 'generic/platform=iOS' \
              PROVISIONING_PROFILE_SPECIFIER="" \
              CODE_SIGNING_ALLOWED=YES \
              2>&1 | tee xcodebuild.log || {
                echo "::error ::xcodebuild archive failed!"
                grep -E -C 3 "(error:|fatal error:|warning:.*failed|The following build commands failed:)" xcodebuild.log || tail -n 120 xcodebuild.log
                exit 1
              }

            echo "Exporting signed IPA..."
            xcodebuild -exportArchive \
              -archivePath build/TransferApp.xcarchive \
              -exportOptionsPlist ExportOptions.plist \
              -exportPath build/out
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransferApp-IPA
          path: ios/build/out/*.ipa
          if-no-files-found: error

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -f $RUNNER_TEMP/build_certificate.p12
          rm -f $RUNNER_TEMP/build_pp.mobileprovision
