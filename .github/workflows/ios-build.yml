name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build & Export iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project with XcodeGen
        run: |
          cd ios
          xcodegen generate --spec project.yml
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' TransferApp.xcodeproj/project.pbxproj

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "::warning ::BUILD_CERTIFICATE_BASE64 not configured. Will produce unsigned simulator build."
            exit 0
          fi

          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Create ExportOptions.plist
        run: |
          cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>destination</key>
              <string>export</string>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Build Archive
        run: |
          cd ios
          mkdir -p build/out
          if [ -z "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" ]; then
            echo "No signing secrets provided. Building unsigned release archive..."
            xcodebuild archive \
              -project TransferApp.xcodeproj \
              -scheme TransferApp \
              -archivePath build/TransferApp.xcarchive \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""

            echo "Packaging unsigned IPA payload..."
            mkdir -p build/payload_temp/Payload
            cp -r build/TransferApp.xcarchive/Products/Applications/TransferApp.app build/payload_temp/Payload/

            echo "Verifying ShareExtension.appex Info.plist..."
            SHARE_PLIST="build/payload_temp/Payload/TransferApp.app/PlugIns/ShareExtension.appex/Info.plist"
            if [ -f "$SHARE_PLIST" ]; then
              plutil -p "$SHARE_PLIST"
              plutil -p "$SHARE_PLIST" | grep -q "NSExtension" || { echo "::error ::NSExtension dictionary is missing from $SHARE_PLIST"; exit 1; }
              echo "ShareExtension Info.plist verified successfully with NSExtension dictionary."
            else
              echo "::error ::ShareExtension.appex/Info.plist not found at $SHARE_PLIST!"
              exit 1
            fi

            cd build/payload_temp
            zip -qr ../out/TransferApp.ipa Payload
            cd ../..
            rm -rf build/payload_temp
          else
            echo "Building signed archive with Apple credentials..."
            xcodebuild archive \
              -project TransferApp.xcodeproj \
              -scheme TransferApp \
              -archivePath build/TransferApp.xcarchive \
              -destination 'generic/platform=iOS' \
              PROVISIONING_PROFILE_SPECIFIER="" \
              CODE_SIGNING_ALLOWED=YES

            echo "Exporting signed IPA..."
            xcodebuild -exportArchive \
              -archivePath build/TransferApp.xcarchive \
              -exportOptionsPlist ExportOptions.plist \
              -exportPath build/out
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransferApp-IPA
          path: ios/build/out/*.ipa
          if-no-files-found: error

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -f $RUNNER_TEMP/build_certificate.p12
          rm -f $RUNNER_TEMP/build_pp.mobileprovision
