name: TransferApp
options:
  bundleIdPrefix: com.transfer.app
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  TransferApp:
    type: application
    platform: iOS
    sources:
      - path: TransferApp
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - Shared
    entitlements:
      path: TransferApp/TransferApp.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.transfer.app
        INFOPLIST_FILE: TransferApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: TransferApp/TransferApp.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
    dependencies:
      - target: ShareExtension
        embed: true
        codeSign: false

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - Shared
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.transfer.app.ShareExtension
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: NO

schemes:
  TransferApp:
    build:
      targets:
        TransferApp: all
        ShareExtension: all
    run:
      config: Debug
    archive:
      config: Release
